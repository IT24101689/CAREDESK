<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${agent.id == null} ? 'Add Agent' : 'Edit Agent'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>/* Use dashboard/login styles */</style>
</head>
<body>
<div class="login-card">
    <h2 th:text="${agent.id == null} ? 'Add New Agent' : 'Edit Agent'"></h2>

    <form action="#" th:action="@{/admin/agents/save}" th:object="${agent}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" th:field="*{name}" id="name" class="form-control" required />
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" th:field="*{email}" id="email" class="form-control" required />
        </div>
        <div class="mb-3">
            <label for="phone" class="form-label">Phone</label>
            <input type="text" th:field="*{phone}" id="phone" class="form-control" />
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" th:field="*{password}" id="password" class="form-control"
                   th:placeholder="${agent.id == null} ? 'Required' : 'Leave blank to keep current password'"
                   th:required="${agent.id == null}" />
        </div>
        <div class="mb-3">
            <label for="role" class="form-label">Role</label>
            <select th:field="*{role}" id="role" class="form-select" required>
                <option th:each="roleOpt : ${roles}" th:value="${roleOpt}" th:text="${roleOpt}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select th:field="*{status}" id="status" class="form-select" required>
                <option th:each="statusOpt : ${statuses}" th:value="${statusOpt}" th:text="${statusOpt}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary w-100">Save Agent</button>
        <a href="/admin/agents" class="btn btn-secondary w-100 mt-2">Cancel</a>
    </form>
</div>
</body>
</html>
