
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${agent.id == null} ? 'Add Agent' : 'Edit Agent'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --dark: #111827;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-800: #1f2937;
            --glass: rgba(255, 255, 255, 0.85);
            --border-radius: 12px;
            --transition: all 0.25s ease;
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        html, body {
            margin: 0;
            min-height: 100%;
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(rgba(243, 244, 246, 0.7), rgba(243, 244, 246, 0.7)), url('https://images.unsplash.com/photo-1581091870622-df5f2ed3fc35?auto=format&fit=crop&w=1470&q=80') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            position: relative;
        }
        .navbar {
            background: var(--glass);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            z-index: 1030;
        }
        .navbar-brand {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.5rem;
        }
        .nav-link {
            font-weight: 500;
            color: var(--dark);
            position: relative;
            transition: var(--transition);
        }
        .nav-link:hover, .nav-link.active {
            color: var(--primary);
        }
        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            height: 3px;
            width: 100%;
            background: var(--primary);
            border-radius: 3px;
        }
        .main-container {
            padding: 2rem 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .form-card {
            background: var(--glass);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(10px);
            padding: 2.5rem 2rem;
            margin-bottom: 2rem;
            position: relative;
        }
        .form-title {
            font-weight: 700;
            font-size: 1.7rem;
            color: var(--dark);
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .form-label {
            font-weight: 500;
            color: var(--dark);
        }
        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid var(--gray-300);
            font-size: 1rem;
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            transition: var(--transition);
        }
        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
            border-color: var(--primary);
            outline: none;
        }
        .btn {
            font-weight: 600;
            padding: 0.65rem 1.5rem;
            transition: var(--transition);
            border-radius: 8px;
            font-size: 1rem;
        }
        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        .btn-primary:hover, .btn-primary:focus {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-2px);
        }
        .btn-secondary {
            background-color: var(--gray-200);
            color: var(--dark);
            border: none;
        }
        .btn-secondary:hover {
            background-color: var(--gray-300);
            color: var(--primary);
        }
        .btn i {
            margin-right: 0.25rem;
        }
        @media (max-width: 768px) {
            .main-container {
                padding: 1rem;
            }
            .form-card {
                padding: 1.5rem 0.5rem;
            }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
<!-- Navigation -->
<nav class="navbar navbar-expand-lg sticky-top mb-4">
    <div class="container">
        <a class="navbar-brand" href="/admin/dashboard">
            <i class="bi bi-headset me-2"></i>CareDesk
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <i class="bi bi-list"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/admin/dashboard">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/agents">
                        <i class="bi bi-people me-1"></i>Agents
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/categories">
                        <i class="bi bi-folder me-1"></i>Categories
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/articles">
                        <i class="bi bi-file-text me-1"></i>Articles
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="main-container animate__animated animate__fadeIn">
    <div class="form-card fade-in">
        <div class="form-title">
            <i class="bi bi-person-plus me-2" th:if="${agent.id == null}"></i>
            <i class="bi bi-pencil-square me-2" th:if="${agent.id != null}"></i>
            <span th:text="${agent.id == null} ? 'Add New Agent' : 'Edit Agent'"></span>
        </div>
        <form action="#" th:action="@{/admin/agents/save}" th:object="${agent}" method="post">
            <input type="hidden" th:field="*{id}" />
            <div class="mb-3">
                <label for="name" class="form-label"><i class="bi bi-person me-1"></i>Full Name</label>
                <input type="text" th:field="*{name}" id="name" class="form-control" required />
            </div>
            <div class="mb-3">
                <label for="email" class="form-label"><i class="bi bi-envelope me-1"></i>Email</label>
                <input type="email" th:field="*{email}" id="email" class="form-control" required />
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label"><i class="bi bi-telephone me-1"></i>Phone</label>
                <input type="text" th:field="*{phone}" id="phone" class="form-control" />
            </div>
            <div class="mb-3">
                <label for="password" class="form-label"><i class="bi bi-key me-1"></i>Password</label>
                <input type="password" th:field="*{password}" id="password" class="form-control"
                       th:placeholder="${agent.id == null} ? 'Required' : 'Leave blank to keep current password'"
                       th:required="${agent.id == null}" />
            </div>
            <div class="mb-3">
                <label for="role" class="form-label"><i class="bi bi-person-badge me-1"></i>Role</label>
                <select th:field="*{role}" id="role" class="form-select" required>
                    <option th:each="roleOpt : ${roles}" th:value="${roleOpt}" th:text="${roleOpt}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label for="status" class="form-label"><i class="bi bi-circle me-1"></i>Status</label>
                <select th:field="*{status}" id="status" class="form-select" required>
                    <option th:each="statusOpt : ${statuses}" th:value="${statusOpt}" th:text="${statusOpt}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-save"></i> Save Agent
            </button>
            <a href="/admin/agents" class="btn btn-secondary w-100 mt-2">
                <i class="bi bi-x-circle"></i> Cancel
            </a>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
