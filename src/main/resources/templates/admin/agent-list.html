<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Agent Management - CareDesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>/* Use dashboard styles */</style>
</head>
<body>
<div class="dashboard-card">
    <h1>Agent Management</h1>
    <a href="/admin/agents/new" class="btn btn-primary mb-3">Add New Agent</a>

    <div class="table-container">
        <table class="table">
            <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Role</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="agent : ${agents}">
                <td th:text="${agent.name}"></td>
                <td th:text="${agent.email}"></td>
                <td th:text="${agent.phone}"></td>
                <td th:text="${agent.role}"></td>
                <td th:text="${agent.status}"></td>
                <td>
                    <a th:href="@{/admin/agents/edit/{id}(id=${agent.id})}" class="btn btn-sm btn-primary">Edit</a>
                    <a th:href="@{/admin/agents/delete/{id}(id=${agent.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?');">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <a href="/admin/dashboard" class="btn btn-secondary mt-3">Back to Dashboard</a>
</div>
</body>
</html>
