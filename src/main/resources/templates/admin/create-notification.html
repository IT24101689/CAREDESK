<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Notification - CareDesk Admin</title>
    <link rel="icon" type="image/png" th:href="@{/CareDeskLog.png}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style th:replace="~{admin_dashboard :: style}"></style> <style>
    .form-card { /* Similar to login/register card */
        background: var(--glass);
        border-radius: var(--border-radius);
        padding: 2.5rem;
        max-width: 800px; /* Wider for this form */
        margin: 2rem auto; /* Center it */
        box-shadow: var(--shadow-md);
        backdrop-filter: blur(10px);
    }
    .form-title {
        font-size: 1.75rem;
        font-weight: 700;
        margin-bottom: 2rem;
        text-align: center;
    }
    textarea { min-height: 150px; }
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top mb-4" th:replace="~{admin_dashboard :: nav(active='none')}"></nav>

<div class="main-container animate__animated animate__fadeIn">
    <div class="form-card">
        <h1 class="form-title"><i class="bi bi-send me-2"></i>Send Manual Notification</h1>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/admin/notifications/send}" method="post">
            <div class="mb-4">
                <label for="customerId" class="form-label fw-semibold">Select Customer</label>
                <select id="customerId" name="customerId" class="form-select" required>
                    <option value="" disabled selected>-- Choose a customer --</option>
                    <option th:each="customer : ${customers}"
                            th:value="${customer.id}"
                            th:text="${customer.name} + ' (' + ${customer.email} + ')'"></option>
                </select>
            </div>

            <div class="mb-4">
                <label for="message" class="form-label fw-semibold">Notification Message</label>
                <textarea id="message" name="message" class="form-control" rows="5" required
                          placeholder="Type the notification message here..."></textarea>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-send"></i> Send Notification
                </button>
                <a href="/admin/dashboard" class="btn btn-secondary">
                    <i class="bi bi-x-lg"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
