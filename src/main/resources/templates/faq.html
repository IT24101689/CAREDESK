<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ - CareDesk</title>
    <link rel="icon" type="image/png" th:href="@{/CareDeskLog.png}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #111827;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-600: #4b5563;
            --gray-800: #1f2937;
            --glass: rgba(255, 255, 255, 0.85);
            --glass-darker: rgba(255, 255, 255, 0.95);
            --border-radius: 12px;
            --transition: all 0.25s ease;
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        html, body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f6f7fc 0%, #e9edf7 100%);
            min-height: 100vh;
            color: var(--dark);
        }

        .navbar {
            background: var(--glass);
            backdrop-filter: blur(8px);
            padding: 1rem;
            border-bottom: 1px solid var(--gray-200);
        }

        .navbar-brand {
            font-weight: 600;
            color: var(--dark);
        }

        .container {
            max-width: 1200px;
            padding: 2rem;
        }

        .search-bar {
            margin: 2rem auto;
            max-width: 700px;
            background: var(--glass-darker);
            padding: 1.5rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(8px);
        }

        .search-bar .form-control {
            border: 1px solid var(--gray-200);
            border-radius: var(--border-radius) 0 0 var(--border-radius);
            padding: 0.75rem 1rem;
            font-size: 1rem;
            transition: var(--transition);
        }

        .search-bar .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1);
        }

        .search-bar .btn {
            border-radius: 0 var(--border-radius) var(--border-radius) 0;
            padding: 0.75rem 1.5rem;
        }

        .article-preview {
            background: var(--glass);
            border-radius: var(--border-radius);
            padding: 1.75rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(8px);
            border: 1px solid var(--gray-200);
            transition: var(--transition);
            animation: fadeIn 0.6s ease-out;
        }

        .article-preview:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 20px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .article-preview h3 {
            color: var(--dark);
            margin-bottom: 1rem;
            font-weight: 600;
            font-size: 1.25rem;
            line-height: 1.4;
        }

        .article-preview p {
            color: var(--gray-600);
            margin-bottom: 1.25rem;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            overflow: hidden;
        }

        .read-more {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            transition: var(--transition);
        }

        .read-more:hover {
            color: var(--primary-hover);
            transform: translateX(4px);
        }

        .read-more i {
            margin-left: 0.5rem;
            font-size: 1.1rem;
        }

        .article-preview .category-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.4rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            color: white;
            background-color: var(--primary);
            margin-bottom: 1rem;
            transition: var(--transition);
        }

        .article-preview .category-badge i {
            margin-right: 0.4rem;
            font-size: 0.9rem;
        }

        .no-results {
            text-align: center;
            padding: 3rem 0;
            color: var(--gray-600);
            animation: fadeIn 0.6s ease-out;
        }

        .no-results i {
            font-size: 3rem;
            color: var(--gray-300);
            margin-bottom: 1rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
            transition: var(--transition);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .page-title {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 2rem;
            text-align: center;
            font-size: 2.25rem;
            animation: fadeIn 0.6s ease-out;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light sticky-top mb-4">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img th:src="@{/CareDeskLog.png}" alt="CareDesk Logo" height="30" class="me-2">
            CareDesk
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/faq">FAQ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/login">Login</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h1 class="page-title">Frequently Asked Questions</h1>

    <div class="search-bar">
        <form th:action="@{/faq}" method="get" class="input-group">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control"
                   placeholder="Search FAQ articles...">
            <button class="btn btn-primary" type="submit">
                <i class="bi bi-search me-2"></i>Search
            </button>
        </form>
    </div>

    <div class="row">
        <div class="col-lg-9 mx-auto">
            <div th:if="${articles.empty}" class="no-results">
                <i class="bi bi-search"></i>
                <p>No articles found matching your search criteria.</p>
            </div>

            <div th:each="article : ${articles}" class="article-preview">
                    <span class="category-badge">
                        <i class="bi bi-bookmark-fill"></i>
                        <span th:text="${article.category.name}">Category</span>
                    </span>
                <h3 th:text="${article.title}">Article Title</h3>
                <p th:text="${article.content}">Article content preview...</p>
                <a th:href="@{/articles/{id}(id=${article.id})}" class="read-more">
                    Read More <i class="bi bi-arrow-right"></i>
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
