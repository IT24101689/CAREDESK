
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Dashboard - CareDesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --info: #0ea5e9;
            --success: #10b981;
            --danger: #ef4444;
            --dark: #111827;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-800: #1f2937;
            --glass: rgba(255, 255, 255, 0.85);
            --border-radius: 12px;
            --transition: all 0.25s ease;
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        html, body {
            margin: 0;
            min-height: 100%;
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(rgba(243, 244, 246, 0.7), rgba(243, 244, 246, 0.7)), url('https://images.unsplash.com/photo-1581091870622-df5f2ed3fc35?auto=format&fit=crop&w=1470&q=80') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            position: relative;
        }
        .navbar {
            background: var(--glass);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            z-index: 1030;
        }
        .navbar-brand {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.5rem;
        }
        .nav-link {
            font-weight: 500;
            color: var(--dark);
            position: relative;
            transition: var(--transition);
        }
        .nav-link:hover, .nav-link.active {
            color: var(--primary);
        }
        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            height: 3px;
            width: 100%;
            background: var(--primary);
            border-radius: 3px;
        }
        .main-container {
            padding: 2rem 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .dashboard-card {
            background: var(--glass);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(10px);
            padding: 2.5rem 2rem;
            margin-bottom: 2rem;
            position: relative;
        }
        .dashboard-title {
            font-weight: 700;
            font-size: 2rem;
            color: var(--dark);
            margin-bottom: 2rem;
            text-align: center;
        }
        .table-container {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
            margin-top: 1rem;
        }
        .table-wrapper {
            max-height: 600px;
            overflow-y: auto;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        thead th {
            background-color: var(--gray-100);
            color: var(--gray-800);
            font-weight: 600;
            padding: 1rem;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 1;
            border-bottom: 1px solid var(--gray-300);
        }
        tbody td {
            padding: 1rem;
            vertical-align: middle;
            border-bottom: 1px solid var(--gray-200);
        }
        tbody tr:last-child td {
            border-bottom: none;
        }
        tbody tr {
            transition: var(--transition);
        }
        tbody tr:hover {
            background-color: var(--gray-100);
        }
        .badge {
            padding: 0.35rem 0.65rem;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 9999px;
        }
        .btn {
            font-weight: 600;
            padding: 0.45rem 1rem;
            transition: var(--transition);
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        .btn-primary:hover, .btn-primary:focus {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-2px);
        }
        .btn i {
            margin-right: 0.25rem;
        }
        @media (max-width: 768px) {
            .main-container {
                padding: 1rem;
            }
            .dashboard-card {
                padding: 1.5rem 0.5rem;
            }
            .table-container {
                margin-top: 0.5rem;
            }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
<!-- Navigation -->
<nav class="navbar navbar-expand-lg sticky-top mb-4">
    <div class="container">
        <a class="navbar-brand" href="/agent/dashboard">
            <i class="bi bi-headset me-2"></i>CareDesk
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <i class="bi bi-list"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/agent/dashboard">
                        <i class="bi bi-house-door me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/agent/tickets">
                        <i class="bi bi-ticket-detailed me-1"></i>Tickets
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="main-container animate__animated animate__fadeIn">
    <div class="dashboard-card fade-in">
        <div class="dashboard-title">
            <i class="bi bi-ticket-detailed me-2"></i>My Assigned Tickets
        </div>
        <div class="table-container">
            <div class="table-wrapper">
                <table class="table mb-0">
                    <thead>
                    <tr>
                        <th>Subject</th>
                        <th>Customer</th>
                        <th>Status</th>
                        <th>Created At</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="ticket : ${tickets}" class="fade-in">
                        <td th:text="${ticket.subject}"></td>
                        <td th:text="${ticket.customer.name}"></td>
                        <td>
                            <span class="badge bg-info" th:if="${ticket.status == 'Open'}">Open</span>
                            <span class="badge bg-success" th:if="${ticket.status == 'Resolved'}">Resolved</span>
                            <span class="badge bg-danger" th:if="${ticket.status == 'Closed'}">Closed</span>
                            <span class="badge bg-secondary" th:if="${ticket.status != 'Open' && ticket.status != 'Resolved' && ticket.status != 'Closed'}" th:text="${ticket.status}"></span>
                        </td>
                        <td th:text="${#temporals.format(ticket.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                        <td>
                            <a th:href="@{/agent/tickets/{id}(id=${ticket.id})}" class="btn btn-primary btn-sm">
                                <i class="bi bi-eye"></i> View Details
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div th:if="${#lists.isEmpty(tickets)}" class="text-center py-5">
                    <i class="bi bi-ticket-detailed" style="font-size:2rem;color:#d1d5db;"></i>
                    <h4 class="mt-3">No tickets assigned</h4>
                    <p>You're all caught up!</p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
