<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Details - CareDesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #111827;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-800: #1f2937;
            --glass: rgba(255, 255, 255, 0.85);
            --border-radius: 12px;
            --transition: all 0.25s ease;
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        html, body {
            margin: 0;
            min-height: 100%;
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(rgba(243, 244, 246, 0.7), rgba(243, 244, 246, 0.7)), url('https://images.unsplash.com/photo-1581091870622-df5f2ed3fc35?auto=format&fit=crop&w=1470&q=80') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            position: relative;
        }
        .navbar {
            background: var(--glass);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            z-index: 1030;
        }
        .navbar-brand {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.5rem;
        }
        .nav-link {
            font-weight: 500;
            color: var(--dark);
            position: relative;
            transition: var(--transition);
        }
        .nav-link:hover, .nav-link.active {
            color: var(--primary);
        }
        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            height: 3px;
            width: 100%;
            background: var(--primary);
            border-radius: 3px;
        }
        .main-container {
            padding: 2rem 1rem;
            max-width: 1000px;
            margin: 0 auto;
        }
        .ticket-card {
            background: var(--glass);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(10px);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .ticket-title {
            font-weight: 700;
            font-size: 1.75rem;
            color: var(--dark);
            margin: 0;
        }
        .badge {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 9999px;
        }
        .ticket-info {
            background: white;
            border-radius: var(--border-radius);
            padding: 1.5rem;
            margin: 1rem 0;
        }
        .ticket-info-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            color: var(--gray-800);
        }
        .ticket-info-item i {
            color: var(--primary);
        }
        .ticket-content {
            background: white;
            border-radius: var(--border-radius);
            padding: 1.5rem;
            margin-top: 1rem;
            white-space: pre-line;
        }
        .form-card {
            background: white;
            border-radius: var(--border-radius);
            padding: 1.5rem;
            margin-top: 1.5rem;
        }
        .form-title {
            font-weight: 600;
            font-size: 1.25rem;
            color: var(--dark);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid var(--gray-300);
            padding: 0.75rem 1rem;
            transition: var(--transition);
        }
        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
            border-color: var(--primary);
            outline: none;
        }
        .btn {
            font-weight: 600;
            padding: 0.65rem 1.5rem;
            transition: var(--transition);
            border-radius: 8px;
        }
        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-2px);
        }
        .btn-outline {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        .btn-outline:hover {
            background-color: var(--primary);
            color: white;
        }
        .alert {
            border-radius: var(--border-radius);
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            border: none;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .alert-success {
            background-color: #dcfce7;
            color: #166534;
        }
        .alert-danger {
            background-color: #fee2e2;
            color: #991b1b;
        }
        @media (max-width: 768px) {
            .main-container {
                padding: 1rem;
            }
            .ticket-card {
                padding: 1.5rem 1rem;
            }
            .ticket-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
<!-- Navigation -->
<nav class="navbar navbar-expand-lg sticky-top mb-4">
    <div class="container">
        <a class="navbar-brand" href="/agent/dashboard">
            <i class="bi bi-headset me-2"></i>CareDesk
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <i class="bi bi-list"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/agent/dashboard">
                        <i class="bi bi-house-door me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/agent/tickets">
                        <i class="bi bi-ticket-detailed me-1"></i>Tickets
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="main-container animate__animated animate__fadeIn">
    <!-- Alerts -->
    <div th:if="${successMessage}" class="alert alert-success fade-in">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger fade-in">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- Ticket Details -->
    <div class="ticket-card fade-in">
        <div class="ticket-header">
            <div>
                <a href="/agent/tickets" class="btn btn-outline mb-3">
                    <i class="bi bi-arrow-left"></i> Back to Tickets
                </a>
                <h1 class="ticket-title" th:text="${ticket.subject}"></h1>
            </div>
            <span class="badge" th:class="${ticket.status == 'OPEN'} ? 'badge bg-warning' : (${ticket.status == 'IN_PROGRESS'} ? 'badge bg-primary' : 'badge bg-success')" th:text="${ticket.status}"></span>
        </div>

        <div class="ticket-info">
            <div class="ticket-info-item">
                <i class="bi bi-person"></i>
                <strong>Customer:</strong>
                <span th:text="${ticket.customer.name}"></span>
            </div>
            <div class="ticket-info-item">
                <i class="bi bi-folder"></i>
                <strong>Category:</strong>
                <span th:text="${ticket.category.name}"></span>
            </div>
            <div class="ticket-content">
                <p th:text="${ticket.content}" class="mb-0"></p>
            </div>
        </div>

        <!-- Response Form -->
        <div class="form-card">
            <div class="form-title">
                <i class="bi bi-chat-dots"></i>Add Your Response
            </div>
            <form th:action="@{/agent/tickets/{id}/responses(id=${ticket.id})}" method="post">
                <div class="mb-3">
                    <textarea name="content" class="form-control" rows="5" required
                              placeholder="Type your response here..."
                              style="resize: vertical;"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-send"></i> Submit Response
                </button>
            </form>
        </div>

        <!-- Status Update Form -->
        <div class="form-card">
            <div class="form-title">
                <i class="bi bi-toggle2-on"></i>Update Ticket Status
            </div>
            <form th:action="@{/agent/tickets/{id}/status(id=${ticket.id})}" method="post" class="d-flex gap-2">
                <select name="status" class="form-select">
                    <option value="OPEN">Open</option>
                    <option value="IN_PROGRESS">In Progress</option>
                    <option value="CLOSED">Closed</option>
                </select>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-arrow-clockwise"></i> Update
                </button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
