<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ticket Details - CareDesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container mt-5">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h2 th:text="${ticket.subject}"></h2>
            <span class="badge bg-primary" th:text="${ticket.status}"></span>
        </div>
        <div class="card-body">
            <p><strong>Customer:</strong> <span th:text="${ticket.customer.name}"></span></p>
            <p><strong>Category:</strong> <span th:text="${ticket.category.name}"></span></p>
            <hr/>
            <p th:text="${ticket.content}"></p>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-header">
            <h4>Add Your Response</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/agent/tickets/{id}/responses(id=${ticket.id})}" method="post">
                <div class="mb-3">
                    <textarea name="content" class="form-control" rows="5" required placeholder="Type your response here..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Submit Response</button>
            </form>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-header">
            <h4>Update Ticket Status</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/agent/tickets/{id}/status(id=${ticket.id})}" method="post">
                <div class="input-group">
                    <select name="status" class="form-select">
                        <option value="OPEN">Open</option>
                        <option value="IN_PROGRESS">In Progress</option>
                        <option value="CLOSED">Closed</option>
                    </select>
                    <button type="submit" class="btn btn-secondary">Update Status</button>
                </div>
            </form>
        </div>
    </div>

    <a href="/agent/tickets" class="btn btn-link mt-3">Back to Dashboard</a>
</div>
</body>
</html>
