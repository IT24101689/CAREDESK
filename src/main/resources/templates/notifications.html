<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notifications - CareDesk</title>
    <link rel="icon" type="image/png" th:href="@{/CareDeskLog.png}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style th:replace="~{customer_dashboard :: style}"></style>
    <style>
        .notification-list { list-style: none; padding: 0; }
        .notification-item {
            background: white;
            border-radius: var(--border-radius);
            padding: 1.25rem 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--gray-200);
            transition: var(--transition);
        }
        .notification-item:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-3px);
        }
        .notification-item.unread {
            background: var(--gray-100);
            border-left: 5px solid var(--primary);
        }
        .notification-content a {
            text-decoration: none;
            color: var(--dark);
            font-weight: 500;
            font-size: 1.1rem;
        }
        .notification-content a:hover {
            color: var(--primary);
        }
        .notification-meta {
            font-size: 0.875rem;
            color: var(--gray-600);
            margin-top: 0.25rem;
        }
        .notification-actions .btn {
            padding: 0.4rem 0.8rem;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top mb-4" th:replace="~{customer_dashboard :: nav(active='none')}"></nav>

<div class="main-container animate__animated animate__fadeIn">
    <div class="dashboard-card fade-in">
        <h1 class="welcome-title" style="text-align: left; font-size: 2rem;">My Notifications</h1>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <ul class="notification-list mt-4">
            <li th:each="notification : ${notifications}"
                class="notification-item"
                th:classappend="${notification.status.name() == 'UNREAD'} ? 'unread' : ''">

                <div class="notification-content">
                    <a th:href="@{/customer/notifications/view/{id}(id=${notification.id})}">
                        <i class="bi bi-chat-left-text me-2"></i>
                        <span th:text="${notification.message}"></span>
                    </a>
                    <div class="notification-meta">
                        <span th:text="${#temporals.format(notification.createdAt, 'MMM dd, yyyy HH:mm')}"></span>
                    </div>
                </div>

                <div class="notification-actions">
                    <a th:href="@{/customer/notifications/delete/{id}(id=${notification.id})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Are you sure you want to delete this notification?');">
                        <i class="bi bi-trash"></i> Delete
                    </a>
                </div>
            </li>

            <li th:if="${#lists.isEmpty(notifications)}" class="notification-item">
                <div class="notification-content">
                    <p class="text-muted mb-0">You have no notifications.</p>
                </div>
            </li>
        </ul>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
