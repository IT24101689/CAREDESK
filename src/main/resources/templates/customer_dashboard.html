<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - CareDesk</title>
    <link rel="icon" type="image/png" th:href="@{/CareDeskLog.png}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #111827;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-600: #4b5563;
            --gray-800: #1f2937;
            --glass: rgba(255, 255, 255, 0.85);
            --glass-darker: rgba(255, 255, 255, 0.95);
            --border-radius: 12px;
            --transition: all 0.25s ease;
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        html, body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(rgba(243, 244, 246, 0.7), rgba(243, 244, 246, 0.7)), url('https://images.unsplash.com/photo-1581091870622-df5f2ed3fc35?auto=format&fit=crop&w=1470&q=80') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
        }

        .navbar {
            background: var(--glass);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            z-index: 1030;
        }

        .navbar-brand {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.5rem;
        }

        .nav-link {
            font-weight: 500;
            color: var(--dark);
            position: relative;
            transition: var(--transition);
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary);
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            height: 3px;
            width: 100%;
            background: var(--primary);
            border-radius: 3px;
        }

        .main-container {
            padding: 2rem 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .dashboard-card {
            background: var(--glass);
            border-radius: var(--border-radius);
            padding: 2.5rem;
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
        }

        .welcome-section {
            text-align: center;
            margin-bottom: 3rem;
        }

        .welcome-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            border-radius: var(--border-radius);
            padding: 1.5rem;
            text-align: center;
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }

        .stat-icon {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--gray-600);
            font-weight: 500;
        }

        .profile-section {
            background: white;
            border-radius: var(--border-radius);
            padding: 2rem;
            margin-top: 2rem;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--gray-200);
        }

        .profile-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--dark);
            margin: 0;
        }

        .profile-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: var(--gray-100);
            border-radius: 8px;
        }

        .info-item i {
            font-size: 1.25rem;
            color: var(--primary);
        }

        .info-label {
            font-weight: 500;
            color: var(--gray-600);
            margin-bottom: 0.25rem;
        }

        .info-value {
            color: var(--dark);
            font-weight: 500;
        }

        .btn {
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }

        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        /* Added styles for danger button */
        .btn-danger {
            background-color: var(--danger);
            border-color: var(--danger);
            color: white;
        }
        .btn-danger:hover {
            background-color: #c82333;
            border-color: #bd2130;
            transform: translateY(-2px);
        }


        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .main-container {
                padding: 1rem;
            }

            .dashboard-card {
                padding: 1.5rem;
            }

            .welcome-title {
                font-size: 2rem;
            }

            .profile-info {
                grid-template-columns: 1fr;
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top mb-4" th:fragment="nav(active)">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-headset me-2"></i>CareDesk
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <i class="bi bi-list"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'dashboard'} ? 'active' : ''" href="/customer/dashboard">
                        <i class="bi bi-grid me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'tickets'} ? 'active' : ''" href="/customer/tickets">
                        <i class="bi bi-ticket-detailed me-1"></i>My Tickets
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link position-relative" th:classappend="${active == 'notifications'} ? 'active' : ''" href="/customer/notifications">
                        <i class="bi bi-bell me-1"></i>Notifications

                        <span th:if="${unreadCount > 0}"
                              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                              th:text="${unreadCount}">
                            <span class="visually-hidden">unread messages</span>
                        </span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/faq">
                        <i class="bi bi-question-circle me-1"></i>FAQ
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="main-container animate__animated animate__fadeIn">
    <div class="dashboard-card welcome-section fade-in">
        <h1 class="welcome-title">Welcome, <span th:text="${customer.name}"></span>! 👋</h1>
        <p class="text-muted">Your support dashboard is ready</p>
    </div>

    <div class="stats-grid">
        <div class="stat-card fade-in">
            <i class="bi bi-ticket stat-icon"></i>
            <div class="stat-label">Active Tickets</div>
            <div class="stat-value">2</div>
        </div>
        <div class="stat-card fade-in">
            <i class="bi bi-check2-circle stat-icon"></i>
            <div class="stat-label">Resolved Tickets</div>
            <div class="stat-value">5</div>
        </div>
        <div class="stat-card fade-in">
            <i class="bi bi-clock-history stat-icon"></i>
            <div class="stat-label">Avg. Response Time</div>
            <div class="stat-value">2h</div>
        </div>
    </div>

    <div class="dashboard-card fade-in">
        <div class="profile-header">
            <i class="bi bi-person-circle fs-3 text-primary"></i>
            <h2 class="profile-title">Profile Information</h2>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>


        <div class="profile-info">
            <div class="info-item">
                <i class="bi bi-person"></i>
                <div>
                    <div class="info-label">Name</div>
                    <div class="info-value" th:text="${customer.name}"></div>
                </div>
            </div>
            <div class="info-item">
                <i class="bi bi-envelope"></i>
                <div>
                    <div class="info-label">Email</div>
                    <div class="info-value" th:text="${customer.email}"></div>
                </div>
            </div>
            <div class="info-item">
                <i class="bi bi-telephone"></i>
                <div>
                    <div class="info-label">Mobile</div>
                    <div class="info-value" th:text="${customer.mobileNo}"></div>
                </div>
            </div>
            <div class="info-item">
                <i class="bi bi-geo-alt"></i>
                <div>
                    <div class="info-label">Address</div>
                    <div class="info-value" th:text="${customer.address}"></div>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <a href="/customer/tickets/new" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i>Create New Ticket
            </a>

            <a th:href="@{/customer/delete-account}" class="btn btn-danger"
               onclick="return confirm('Are you sure you want to delete your account? This action is permanent and all your tickets will be removed.');">
                <i class="bi bi-trash"></i>Delete My Account
            </a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
