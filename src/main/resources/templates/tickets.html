<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tickets - CareDesk</title>
    <link rel="icon" type="image/png" th:href="@{/CareDeskLog.png}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #111827;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-600: #4b5563;
            --gray-800: #1f2937;
            --glass: rgba(255, 255, 255, 0.85);
            --glass-darker: rgba(255, 255, 255, 0.95);
            --border-radius: 12px;
            --transition: all 0.25s ease;
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        html, body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f6f7fc 0%, #e9edf7 100%);
            min-height: 100vh;
            color: var(--dark);
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar {
            background: var(--glass);
            backdrop-filter: blur(8px);
            padding: 1rem;
            border-bottom: 1px solid var(--gray-200);
        }

        .navbar-brand {
            font-weight: 600;
            color: var(--dark);
            font-size: 1.25rem;
        }

        .main-content {
            flex: 1;
            padding: 2rem 1rem;
        }

        .tickets-card {
            background: var(--glass);
            border-radius: var(--border-radius);
            padding: 2rem;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(8px);
            border: 1px solid var(--gray-200);
            animation: fadeIn 0.6s ease-out;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-title {
            font-weight: 700;
            font-size: 1.75rem;
            color: var(--dark);
            margin: 0;
        }

        .table {
            background: var(--glass-darker);
            border-radius: var(--border-radius);
            border: 1px solid var(--gray-200);
            margin-bottom: 2rem;
        }

        .table th {
            font-weight: 600;
            color: var(--gray-800);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            padding: 1rem;
            border-bottom: 2px solid var(--gray-200);
            background: var(--gray-100);
        }

        .table td {
            padding: 1rem;
            color: var(--gray-800);
            vertical-align: middle;
            border-bottom: 1px solid var(--gray-200);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.4rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            gap: 0.5rem;
        }

        .status-new {
            background-color: rgba(79, 70, 229, 0.1);
            color: var(--primary);
        }

        .status-in-progress {
            background-color: rgba(245, 158, 11, 0.1);
            color: var(--warning);
        }

        .status-resolved {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .status-closed {
            background-color: rgba(75, 85, 99, 0.1);
            color: var(--gray-600);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: var(--border-radius);
            transition: var(--transition);
        }

        .btn i {
            font-size: 1.1rem;
        }

        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: var(--gray-100);
            border: 1px solid var(--gray-200);
            color: var(--dark);
        }

        .btn-secondary:hover {
            background-color: var(--gray-200);
            transform: translateY(-2px);
        }

        .btn-icon {
            padding: 0.5rem;
            font-size: 1.1rem;
        }

        .ticket-actions {
            display: flex;
            gap: 0.5rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 0;
            color: var(--gray-600);
        }

        .empty-state i {
            font-size: 3rem;
            color: var(--gray-300);
            margin-bottom: 1rem;
        }

        .date-column {
            white-space: nowrap;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img th:src="@{/CareDeskLog.png}" alt="CareDesk Logo" height="30" class="me-2">
            CareDesk
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/customer/dashboard">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/customer/tickets">My Tickets</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/faq">FAQ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="main-content">
    <div class="tickets-card">
        <div class="page-header">
            <h1 class="page-title">My Support Tickets</h1>
            <a href="/customer/tickets/new" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i>
                Create New Ticket
            </a>
        </div>

        <div th:if="${tickets.empty}" class="empty-state">
            <i class="bi bi-ticket-perforated"></i>
            <p>You haven't created any tickets yet. Click the button above to create your first ticket.</p>
        </div>

        <div th:if="${!tickets.empty}" class="table-responsive">
            <table class="table">
                <thead>
                <tr>
                    <th>Subject</th>
                    <th>Status</th>
                    <th>Created At</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ticket : ${tickets}">
                    <td th:text="${ticket.subject}">Subject</td>
                    <td>
                                <span th:class="'status-badge ' + 'status-' + ${#strings.toLowerCase(ticket.status.replace(' ', '-'))}">
                                    <i class="bi"
                                       th:classappend="${ticket.status == 'NEW' ? 'bi-star-fill' :
                                                       ticket.status == 'IN_PROGRESS' ? 'bi-hourglass-split' :
                                                       ticket.status == 'RESOLVED' ? 'bi-check-circle-fill' :
                                                       'bi-x-circle-fill'}"></i>
                                    <span th:text="${#strings.capitalize(#strings.toLowerCase(ticket.status.replace('_', ' ')))}">Status</span>
                                </span>
                    </td>
                    <td class="date-column" th:text="${#temporals.format(ticket.createdAt, 'MMM dd, yyyy HH:mm')}">Created At</td>
                    <td>
                        <div class="ticket-actions">
                            <a th:href="@{/customer/tickets/{id}(id=${ticket.id})}"
                               class="btn btn-primary btn-icon"
                               title="View Ticket">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="@{/customer/tickets/delete/{id}(id=${ticket.id})}"
                               class="btn btn-danger btn-icon"
                               onclick="return confirm('Are you sure you want to delete this ticket? This action cannot be undone.');"
                               title="Delete Ticket">
                                <i class="bi bi-trash"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-4">
            <a href="/customer/dashboard" class="btn btn-secondary">
                <i class="bi bi-house"></i>
                Back to Dashboard
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
