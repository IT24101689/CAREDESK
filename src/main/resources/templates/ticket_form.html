<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Ticket - CareDesk</title>
    <link rel="icon" type="image/png" th:href="@{/CareDeskLog.png}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #111827;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-600: #4b5563;
            --gray-800: #1f2937;
            --glass: rgba(255, 255, 255, 0.85);
            --glass-darker: rgba(255, 255, 255, 0.95);
            --border-radius: 12px;
            --transition: all 0.25s ease;
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        html, body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f6f7fc 0%, #e9edf7 100%);
            min-height: 100vh;
            color: var(--dark);
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar {
            background: var(--glass);
            backdrop-filter: blur(8px);
            padding: 1rem;
            border-bottom: 1px solid var(--gray-200);
        }

        .navbar-brand {
            font-weight: 600;
            color: var(--dark);
            font-size: 1.25rem;
        }

        .main-content {
            flex: 1;
            padding: 2rem 1rem;
        }

        .form-card {
            background: var(--glass);
            border-radius: var(--border-radius);
            padding: 2.5rem;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(8px);
            border: 1px solid var(--gray-200);
            animation: fadeIn 0.6s ease-out;
        }

        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-title {
            font-weight: 700;
            font-size: 1.75rem;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .form-subtitle {
            color: var(--gray-600);
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-weight: 500;
            color: var(--gray-800);
            margin-bottom: 0.5rem;
            display: block;
        }

        .form-control {
            border: 1px solid var(--gray-200);
            border-radius: var(--border-radius);
            padding: 0.75rem 1rem;
            font-size: 1rem;
            transition: var(--transition);
            background: var(--glass-darker);
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236B7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.75rem center;
            background-repeat: no-repeat;
            background-size: 1.5em;
            padding-right: 2.5rem;
        }

        textarea.form-control {
            min-height: 200px;
            resize: vertical;
        }

        .input-group {
            position: relative;
        }

        .input-group .bi {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-600);
            font-size: 1.1rem;
            pointer-events: none;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: var(--border-radius);
            transition: var(--transition);
        }

        .btn i {
            font-size: 1.1rem;
        }

        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: var(--gray-100);
            border: 1px solid var(--gray-200);
            color: var(--dark);
        }

        .btn-secondary:hover {
            background-color: var(--gray-200);
            transform: translateY(-2px);
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img th:src="@{/CareDeskLog.png}" alt="CareDesk Logo" height="30" class="me-2">
            CareDesk
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/customer/dashboard">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/customer/tickets">My Tickets</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/faq">FAQ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="main-content">
    <div class="form-card">
        <div class="form-header">
            <h1 class="form-title">Create Support Ticket</h1>
            <p class="form-subtitle">Please provide details about your issue or request</p>
        </div>

        <form th:action="@{/customer/tickets}" method="post">
            <div class="form-group">
                <label for="subject" class="form-label">Subject</label>
                <div class="input-group">
                    <input type="text" id="subject" name="subject" class="form-control"
                           placeholder="Brief description of your issue" required>
                    <i class="bi bi-chat-left-text"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="category" class="form-label">Category</label>
                <div class="input-group">
                    <select id="category" name="category.id" class="form-control" required>
                        <option value="" disabled selected>Select the most relevant category</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}">Category Name</option>
                    </select>
                    <i class="bi bi-folder"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="content" class="form-label">Description</label>
                <textarea id="content" name="content" class="form-control"
                          placeholder="Please provide detailed information about your issue..."
                          required></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-send"></i>
                    Submit Ticket
                </button>
                <a href="/customer/tickets" class="btn btn-secondary">
                    <i class="bi bi-x-lg"></i>
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
