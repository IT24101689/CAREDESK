<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CareDesk</title>
    <link rel="icon" type="image/png" th:href="@{/CareDeskLog.png}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #111827;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-600: #4b5563;
            --gray-800: #1f2937;
            --glass: rgba(255, 255, 255, 0.85);
            --glass-darker: rgba(255, 255, 255, 0.95);
            --border-radius: 12px;
            --transition: all 0.25s ease;
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        html, body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f6f7fc 0%, #e9edf7 100%);
            min-height: 100vh;
            color: var(--dark);
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
        }

        .navbar {
            background: var(--glass);
            backdrop-filter: blur(8px);
            padding: 1rem;
            border-bottom: 1px solid var(--gray-200);
        }

        .navbar-brand {
            font-weight: 600;
            color: var(--dark);
            font-size: 1.25rem;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem;
        }

        .hero-content {
            background: var(--glass);
            border-radius: var(--border-radius);
            padding: 3rem;
            max-width: 800px;
            width: 100%;
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(8px);
            border: 1px solid var(--gray-200);
            animation: fadeIn 0.6s ease-out;
        }

        .hero-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 2rem;
            animation: bounce 2s ease infinite;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
        }

        .hero-title {
            font-weight: 700;
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--dark);
            background: linear-gradient(to right, var(--primary), var(--primary-hover));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-description {
            font-size: 1.25rem;
            color: var(--gray-600);
            margin-bottom: 2.5rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.875rem 2rem;
            font-weight: 600;
            border-radius: 9999px;
            text-decoration: none;
            transition: var(--transition);
            margin: 0.5rem;
            gap: 0.5rem;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            color: white;
        }

        .btn-secondary {
            background-color: var(--gray-100);
            color: var(--dark);
            border: 1px solid var(--gray-200);
        }

        .btn-secondary:hover {
            background-color: var(--gray-200);
            transform: translateY(-2px);
            color: var(--dark);
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }

        .btn i {
            font-size: 1.1rem;
        }

        footer {
            width: 100%;
            padding: 2rem;
            text-align: center;
            font-size: 0.875rem;
            color: var(--gray-600);
            background: var(--glass);
            backdrop-filter: blur(8px);
            border-top: 1px solid var(--gray-200);
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img th:src="@{/CareDeskLog.png}" alt="CareDesk Logo" height="30" class="me-2">
            CareDesk
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/faq">FAQ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/login">Login</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="hero">
    <div class="hero-content">
        <img class="hero-icon" th:src="@{/CareDeskLog.png}" alt="CareDesk Icon">
        <h1 class="hero-title">Welcome to CareDesk</h1>
        <p class="hero-description">Your comprehensive customer care portal. Access your account, manage support tickets, browse FAQs, and get the help you need - all in one place.</p>
        <div class="btn-group">
            <a href="/login" class="btn-action btn-primary">
                <i class="bi bi-box-arrow-in-right"></i>
                Login to Dashboard
            </a>
            <a href="/faq" class="btn-action btn-secondary">
                <i class="bi bi-question-circle"></i>
                Browse FAQ
            </a>
            <a href="/register" class="btn-action btn-primary" style="background-color: var(--success);">
                <i class="bi bi-person-plus"></i>
                Register New Account
            </a>
        </div>
    </div>
</main>

<footer>
    <div class="container">
        <p class="mb-0">&copy; 2025 CareDesk. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
