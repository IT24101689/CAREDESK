<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Form - CareDesk</title>
    <link rel="icon" type="image/png" th:href="@{/CareDeskLog.png}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #111827;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-600: #4b5563;
            --gray-800: #1f2937;
            --glass: rgba(255, 255, 255, 0.85);
            --glass-darker: rgba(255, 255, 255, 0.95);
            --border-radius: 12px;
            --transition: all 0.25s ease;
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        html, body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(rgba(243, 244, 246, 0.7), rgba(243, 244, 246, 0.7)), url('https://images.unsplash.com/photo-1581091870622-df5f2ed3fc35?auto=format&fit=crop&w=1470&q=80') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
        }

        .navbar {
            background: var(--glass);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            z-index: 1030;
        }

        .navbar-brand {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.5rem;
        }

        .nav-link {
            font-weight: 500;
            color: var(--dark);
            position: relative;
            transition: var(--transition);
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary);
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            height: 3px;
            width: 100%;
            background: var(--primary);
            border-radius: 3px;
        }

        .main-container {
            padding: 2rem 1rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .form-card {
            background: var(--glass);
            border-radius: var(--border-radius);
            padding: 2.5rem;
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(10px);
        }

        .form-header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .form-subtitle {
            color: var(--gray-600);
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            background: white;
            padding: 1.5rem;
            border-radius: var(--border-radius);
        }

        .form-label {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-label i {
            color: var(--primary);
            font-size: 1.1rem;
        }

        .form-control {
            border-radius: 8px;
            border: 1px solid var(--gray-300);
            padding: 0.75rem 1rem;
            transition: var(--transition);
            background-color: var(--gray-100);
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            background-color: white;
        }

        select.form-control {
            cursor: pointer;
            appearance: none;
            padding-right: 2.5rem;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.75rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
        }

        textarea.form-control {
            min-height: 200px;
            resize: vertical;
        }

        .btn {
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }

        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: white;
            border: 1px solid var(--gray-300);
            color: var(--gray-800);
        }

        .btn-secondary:hover {
            background-color: var(--gray-100);
            transform: translateY(-2px);
        }

        .form-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        @media (max-width: 768px) {
            .main-container {
                padding: 1rem;
            }

            .form-card {
                padding: 1.5rem;
            }

            .form-group {
                padding: 1rem;
            }

            .form-title {
                font-size: 1.75rem;
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<!-- Navigation -->
<nav class="navbar navbar-expand-lg sticky-top mb-4">
    <div class="container">
        <a class="navbar-brand" href="/admin/dashboard">
            <i class="bi bi-shield-lock me-2"></i>CareDesk Admin
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <i class="bi bi-list"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/admin/dashboard">
                        <i class="bi bi-grid me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/admin/articles">
                        <i class="bi bi-file-text me-1"></i>Articles
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/agents">
                        <i class="bi bi-people me-1"></i>Agents
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/categories">
                        <i class="bi bi-folder me-1"></i>Categories
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="main-container animate__animated animate__fadeIn">
    <div class="form-card fade-in">
        <!-- Form Header -->
        <div class="form-header">
            <h1 class="form-title">
                <i class="bi" th:classappend="${article.id} != null ? 'bi-pencil-square' : 'bi-plus-circle'"></i>
                <span th:text="${article.id} != null ? 'Edit Article' : 'Add New Article'"></span>
            </h1>
            <p class="form-subtitle" th:if="${article.id} == null">Create a new FAQ article to help customers find answers quickly</p>
        </div>

        <!-- Article Form -->
        <form th:action="(${article.id} != null) ? @{'/admin/articles/update/' + ${article.id}} : @{/admin/articles}" method="post">            <div class="form-group">
                <label class="form-label">
                    <i class="bi bi-type"></i>Title
                </label>
                <input type="text" class="form-control" name="title" th:value="${article.title}"
                       required placeholder="Enter a clear, concise question" />
            </div>

            <div class="form-group">
                <label class="form-label">
                    <i class="bi bi-text-paragraph"></i>Content
                </label>
                <textarea class="form-control" name="content" required
                          placeholder="Provide a detailed, helpful answer..."
                          th:text="${article.content}"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">
                    <i class="bi bi-folder"></i>Category
                </label>
                <select class="form-control" name="category.id" required>
                    <option value="" disabled selected>Select a category for this article</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.id}"
                            th:text="${cat.name}"
                            th:selected="${article.category != null and cat.id == article.category.id}">
                    </option>
                </select>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn btn-primary">
                    <i class="bi" th:classappend="${article.id} != null ? 'bi-save' : 'bi-plus-lg'"></i>
                    <span th:text="${article.id} != null ? 'Save Changes' : 'Create Article'"></span>
                </button>
                <a href="/admin/articles" class="btn btn-secondary">
                    <i class="bi bi-x-lg"></i>Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
