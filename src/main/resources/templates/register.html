<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CareDesk</title>
    <link rel="icon" type="image/png" th:href="@{/CareDeskLog.png}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --dark: #111827;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-800: #1f2937;
            --glass: rgba(255, 255, 255, 0.85);
            --border-radius: 12px;
            --transition: all 0.25s ease;
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        html, body {
            margin: 0;
            min-height: 100%;
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(rgba(243, 244, 246, 0.7), rgba(243, 244, 246, 0.7)), url('https://images.unsplash.com/photo-1581091870622-df5f2ed3fc35?auto=format&fit=crop&w=1470&q=80') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            position: relative;
        }
        .navbar {
            background: var(--glass);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            z-index: 1030;
        }
        .navbar-brand {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.5rem;
        }
        .nav-link {
            font-weight: 500;
            color: var(--dark);
            position: relative;
            transition: var(--transition);
        }
        .nav-link:hover, .nav-link.active {
            color: var(--primary);
        }
        .main-content {
            padding: 2rem 1rem;
            max-width: 600px;
            margin: 0 auto;
        }
        .login-card {
            background: var(--glass);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(10px);
            padding: 2.5rem 2rem;
            margin-bottom: 2rem;
            position: relative;
            animation: fadeIn 0.5s ease-in;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-title {
            font-weight: 700;
            font-size: 1.7rem;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }
        .login-subtitle {
            color: var(--gray-800);
            font-size: 1rem;
        }
        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
        }
        .form-label {
            font-weight: 500;
            color: var(--dark);
            display: block;
            margin-bottom: 0.5rem;
        }
        .form-control {
            border-radius: 8px;
            border: 1px solid var(--gray-300);
            font-size: 1rem;
            padding: 0.75rem 1rem;
            padding-left: 2.5rem;
            width: 100%;
            transition: var(--transition);
        }
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
            border-color: var(--primary);
            outline: none;
        }
        .input-group i {
            position: absolute;
            left: 1rem;
            top: 2.4rem;
            color: var(--gray-800);
        }
        .btn {
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            transition: var(--transition);
            border-radius: 8px;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
            width: 100%;
            margin-bottom: 1rem;
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-2px);
        }
        .btn-secondary {
            background-color: var(--gray-200);
            color: var(--dark);
            border: none;
            width: 100%;
        }
        .btn-secondary:hover {
            background-color: var(--gray-300);
            color: var(--primary);
        }
        .alert {
            border-radius: var(--border-radius);
            margin-bottom: 1.5rem;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .alert-success {
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .alert-danger {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        @media (max-width: 768px) {
            .main-content {
                padding: 1rem;
            }
            .login-card {
                padding: 1.5rem 1rem;
            }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-headset me-2"></i>CareDesk
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <i class="bi bi-list"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">
                        <i class="bi bi-house-door me-1"></i>Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/login">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Login
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="main-content">
    <div class="login-card">
        <div class="login-header">
            <h1 class="login-title">Create Your Account</h1>
            <p class="login-subtitle">Join CareDesk to manage your support tickets</p>
        </div>

        <div th:if="${successMessage}" class="alert alert-success">
            <i class="bi bi-check-circle"></i>
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger">
            <i class="bi bi-exclamation-circle"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <form method="post" th:action="@{/register}" th:object="${customer}">
            <div class="input-group">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" id="name" th:field="*{name}" class="form-control"
                       placeholder="Enter your full name" required>
                <i class="bi bi-person"></i>
            </div>
            <div class="input-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" th:field="*{email}" class="form-control"
                       placeholder="Enter your email" required>
                <i class="bi bi-envelope"></i>
            </div>
            <div class="input-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" th:field="*{password}" class="form-control"
                       placeholder="Enter your password" required>
                <i class="bi bi-lock"></i>
            </div>
            <div class="input-group">
                <label for="mobileNo" class="form-label">Mobile Number</label>
                <input type="text" id="mobileNo" th:field="*{mobileNo}" class="form-control"
                       placeholder="Enter your mobile number" required>
                <i class="bi bi-telephone"></i>
            </div>
            <div class="input-group">
                <label for="address" class="form-label">Address</label>
                <input type="text" id="address" th:field="*{address}" class="form-control"
                       placeholder="Enter your address" required>
                <i class="bi bi-geo-alt"></i>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="bi bi-person-plus"></i>
                Create Account
            </button>

            <a href="/login" class="btn btn-secondary">
                <i class="bi bi-box-arrow-in-right"></i>
                Already have an account? Login
            </a>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
